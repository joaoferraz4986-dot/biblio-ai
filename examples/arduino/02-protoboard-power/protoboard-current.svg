<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="title desc"><title id="title">Nós de uma protoboard e caminho da corrente</title><desc id="desc">Trilhos positivo e negativo alimentam grupos internos de cinco furos. Um resistor e um LED formam o caminho de corrente convencional até o retorno GND.</desc><rect width="900" height="430" rx="18" fill="#0d1726"/><text x="40" y="42" fill="#e6edf7" font-family="sans-serif" font-size="24" font-weight="700">Protoboard: nós e retorno</text><rect x="55" y="82" width="790" height="280" rx="14" fill="#e8edf2"/><rect x="75" y="105" width="750" height="30" rx="8" fill="#ffd5d5" stroke="#d85858"/><text x="92" y="126" font-family="sans-serif" font-size="16" fill="#a32222">+  trilho de alimentação</text><rect x="75" y="309" width="750" height="30" rx="8" fill="#d9dde3" stroke="#596579"/><text x="92" y="330" font-family="sans-serif" font-size="16" fill="#26364d">−  trilho de retorno / GND</text><line x1="450" y1="150" x2="450" y2="294" stroke="#aab4c1" stroke-width="3" stroke-dasharray="8 8"/><text x="417" y="177" font-family="sans-serif" font-size="14" fill="#506175">canal</text><g fill="#fff" stroke="#77879a"> <circle cx="150" cy="205" r="9"/><circle cx="185" cy="205" r="9"/><circle cx="220" cy="205" r="9"/><circle cx="255" cy="205" r="9"/><circle cx="290" cy="205" r="9"/><circle cx="610" cy="205" r="9"/><circle cx="645" cy="205" r="9"/><circle cx="680" cy="205" r="9"/><circle cx="715" cy="205" r="9"/><circle cx="750" cy="205" r="9"/></g><path d="M115 120 C115 155 150 175 150 196 M785 324 C785 285 750 250 750 214" fill="none" stroke="#d85858" stroke-width="5" marker-end="url(#arrow)"/><path d="M290 205 H360 M540 205 H610" stroke="#f08a24" stroke-width="7"/><path d="M360 205 h80 l40 0 h60" fill="none" stroke="#f08a24" stroke-width="7"/><text x="135" y="250" font-family="sans-serif" font-size="15" fill="#33465e">grupo de 5 nós</text><text x="620" y="250" font-family="sans-serif" font-size="15" fill="#33465e">grupo de 5 nós</text><text x="360" y="286" font-family="sans-serif" font-size="15" fill="#a95400">corrente convencional →</text><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#d85858"/></marker></defs></svg>
