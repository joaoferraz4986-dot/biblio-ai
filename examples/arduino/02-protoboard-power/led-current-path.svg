<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="title desc"><title id="title">Caminho da corrente do LED</title><desc id="desc">O pino de saída do Arduino alimenta um resistor e o LED; o cátodo retorna ao GND.</desc><rect width="900" height="300" rx="18" fill="#0d1726"/><text x="40" y="45" fill="#e6edf7" font-family="sans-serif" font-size="24" font-weight="700">Caminho da corrente convencional</text><g font-family="sans-serif" text-anchor="middle"><rect x="55" y="105" width="150" height="74" rx="10" fill="#203c62" stroke="#76a9fa" stroke-width="2"/><text x="130" y="137" fill="#fff" font-size="19">Arduino</text><text x="130" y="160" fill="#c6d8f0" font-size="15">D13 = HIGH</text><rect x="280" y="112" width="120" height="60" rx="8" fill="#5b3a1c" stroke="#f4a340" stroke-width="2"/><text x="340" y="148" fill="#fff" font-size="18">220 Ω</text><circle cx="550" cy="142" r="36" fill="#d83d4b" stroke="#ffabb1" stroke-width="3"/><text x="550" y="149" fill="#fff" font-size="18">LED</text><rect x="690" y="105" width="150" height="74" rx="10" fill="#29394d" stroke="#9fb3c8" stroke-width="2"/><text x="765" y="137" fill="#fff" font-size="19">GND</text><text x="765" y="160" fill="#c6d8f0" font-size="15">retorno</text></g><path d="M205 142 H280 M400 142 H514 M586 142 H690" stroke="#f4a340" stroke-width="6" fill="none" marker-end="url(#arrow)"/><text x="350" y="215" fill="#f8c46b" font-family="sans-serif" font-size="16">o resistor limita a corrente</text><text x="590" y="245" fill="#c6d8f0" font-family="sans-serif" font-size="15">elétrons: sentido físico oposto</text><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0,0 L0,8 L11,4 z" fill="#f4a340"/></marker></defs></svg>
